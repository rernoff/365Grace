<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>365 Grace / 365 Grâce</title>
<meta name="description" content="365 Grâce — un parcours de lecture biblique en 365 jours. Verset du jour, méditation personnelle, en français et en anglais.">
<meta name="theme-color" content="#101827">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="canonical" href="https://www.365grace.online/">
<meta property="og:title" content="365 Grâce — 365 jours pour lire toute la Bible">
<meta property="og:description" content="Chaque jour compte : parcourez toute la Bible en 365 jours de grâce, un verset à la fois.">
<meta property="og:image" content="https://www.365grace.online/logo-share.png">
<meta property="og:url" content="https://www.365grace.online/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="365 Grâce — 365 jours pour lire toute la Bible">
<meta name="twitter:description" content="Chaque jour compte : parcourez toute la Bible en 365 jours de grâce, un verset à la fois.">
<meta name="twitter:image" content="https://www.365grace.online/logo-share.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F8F5EE;
    --surface:#FFFFFF;
    --surface-2:#EDE6D8;
    --ink:#101827;
    --ink-dim:#5B6472;
    --ink-dim2:#8C7434;
    --gold:#96762E;
    --gold-bright:#D6B56A;
    --gold-dim:rgba(214,181,106,0.32);
    --navy:#243B64;
    --sage:#91A58A;
    --line:rgba(16,24,39,0.12);
    --scripture-scale:1;
    --serif:'Cormorant Garamond','Iowan Old Style','Palatino Linotype',Georgia,serif;
    --sans:'Inter','Avenir Next','Segoe UI',Helvetica,Arial,sans-serif;
  }
  html[data-theme="dark"]{
    --bg:#0D1420;
    --surface:#161F2E;
    --surface-2:#1E2A3D;
    --ink:#F5F0E6;
    --ink-dim:#AAB2BF;
    --ink-dim2:#D8C79A;
    --gold:#D6B56A;
    --gold-bright:#E8C685;
    --gold-dim:rgba(217,178,107,0.35);
    --navy:#7C9CC4;
    --sage:#9DB69A;
    --line:rgba(245,240,230,0.14);
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  html{background:var(--bg);}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);}
  body{min-height:100vh;background:var(--bg);}
  #app{max-width:760px;margin:0 auto;padding:0 18px 60px;background:var(--bg);min-height:100vh;}

  @keyframes riseIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

  header.topbar{
    padding:28px 0 18px;
    display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
    border-bottom:1px solid var(--line);
    animation:riseIn .6s ease both;
  }
  .brand{display:flex;gap:16px;align-items:center;}
  .brand .logo-wrap{
    position:relative;flex-shrink:0;width:64px;height:64px;display:flex;align-items:center;justify-content:center;
  }
  .brand .logo-wrap::before{
    content:'';position:absolute;inset:-14px;border-radius:50%;
    background:radial-gradient(circle, var(--gold-dim) 0%, transparent 70%);
  }
  .brand img{width:64px;height:auto;display:block;position:relative;z-index:1;}
  h1{font-family:var(--serif);font-weight:600;font-size:30px;margin:0 0 4px;letter-spacing:.2px;}
  header p.subtitle{margin:0;color:var(--ink-dim2);font-size:14px;}
  .tagline{
    font-family:var(--serif);font-style:italic;font-size:16px;color:var(--navy);
    margin:16px 0 0;line-height:1.5;border-top:1px solid var(--line);padding-top:14px;
  }

  .continue-card{
    display:flex;flex-direction:column;align-items:flex-start;gap:4px;width:100%;text-align:left;
    background:linear-gradient(135deg, var(--navy), #16233B);color:#F5F0E6;border:none;border-radius:18px;
    padding:20px 22px;margin-top:18px;cursor:pointer;box-shadow:0 6px 24px rgba(16,24,39,0.18);
  }
  .continue-label{font-family:var(--sans);font-size:12px;letter-spacing:.5px;color:var(--gold-bright);opacity:.9;}
  .continue-day{font-family:var(--serif);font-size:24px;font-weight:600;margin-top:2px;}
  .continue-reading{font-family:var(--sans);font-size:13.5px;color:#D7DEE8;margin-top:2px;}
  .continue-cta{font-family:var(--sans);font-size:13px;color:var(--gold-bright);margin-top:10px;font-weight:600;}

  .lang-toggle{
    background:var(--surface);border:1px solid var(--line);color:var(--ink);
    font-family:var(--sans);font-size:13px;padding:8px 14px;border-radius:999px;cursor:pointer;
    display:flex;gap:6px;align-items:center;white-space:nowrap;
  }
  .lang-toggle span{opacity:.4;}
  .lang-toggle span.active{opacity:1;color:var(--gold);font-weight:600;}

  .progress-wrap{margin:20px 0 6px;}
  .progress-track{height:6px;border-radius:3px;background:var(--surface);overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--navy),var(--gold-bright));width:0%;transition:width .4s ease;}
  .progress-label{display:block;margin-top:8px;font-size:12.5px;color:var(--ink-dim2);}

  .today-jump{
    margin-top:12px;background:none;border:1px solid var(--gold-dim);color:var(--gold);
    font-family:var(--sans);font-size:13px;padding:7px 12px;border-radius:8px;cursor:pointer;
  }

  nav.month-rail{
    display:flex;gap:6px;overflow-x:auto;padding:20px 0 4px;margin-bottom:6px;
    scrollbar-width:thin;
  }
  nav.month-rail::-webkit-scrollbar{height:5px;}
  nav.month-rail::-webkit-scrollbar-thumb{background:var(--surface-2);border-radius:4px;}
  .month-btn{
    flex:0 0 auto;background:transparent;border:1px solid var(--line);color:var(--ink-dim2);
    font-family:var(--sans);font-size:13px;padding:8px 13px;border-radius:8px;cursor:pointer;
  }
  .month-btn.active{border-color:var(--gold);color:var(--gold);background:rgba(217,178,107,0.22);}
  .month-btn .month-pct{
    display:block;font-size:10.5px;color:var(--gold);opacity:.75;margin-top:2px;font-weight:600;
  }

  .search-row{display:flex;gap:8px;margin-top:18px;}
  .search-input{
    flex:1;background:var(--surface);border:1px solid var(--line);border-radius:10px;
    color:var(--ink);font-family:var(--sans);font-size:14px;padding:10px 14px;
  }

  .view-toggle{display:flex;gap:6px;margin-top:18px;}
  .view-toggle-btn{
    background:none;border:1px solid var(--line);color:var(--ink-dim);font-family:var(--sans);
    font-size:12.5px;padding:7px 13px;border-radius:8px;cursor:pointer;
  }
  .view-toggle-btn.active{border-color:var(--gold);color:var(--gold);background:rgba(214,181,106,0.15);}

  .year-heatmap{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(26px,1fr));gap:3px;padding:16px 0 30px;
  }
  .heat-cell{
    aspect-ratio:1;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);cursor:pointer;
    position:relative;display:flex;align-items:center;justify-content:center;
    font-family:var(--sans);font-size:9px;color:var(--ink-dim2);line-height:1;
  }
  .heat-cell.read{background:var(--gold-bright);border-color:var(--gold);color:var(--navy);}
  .heat-cell.today{box-shadow:0 0 0 1.5px var(--navy) inset;}

  .day-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:8px;padding:10px 0 30px;
  }
  .day-cell{
    aspect-ratio:1;border-radius:12px;border:1px solid var(--line);background:var(--surface);
    display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;
    font-family:var(--sans);font-size:14px;color:var(--ink-dim2);transition:border-color .2s ease,transform .2s ease;
  }
  .day-cell:hover{border-color:var(--gold-dim);transform:translateY(-1px);}
  .day-cell.read{background:rgba(214,181,106,0.22);border-color:var(--gold-bright);color:var(--gold);}
  .day-cell.today{box-shadow:0 0 0 2px var(--navy) inset;}
  .day-cell.today::after{
    content:'';position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--navy);
  }

  .day-detail{
    background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px 24px 28px;
    box-shadow:0 4px 28px rgba(16,24,39,0.06);
    animation:riseIn .4s ease both;margin-bottom:40px;
  }
  .detail-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}

  .completion-banner{
    text-align:center;padding:22px 16px 26px;margin:-4px -2px 22px;border-bottom:1px solid var(--line);
  }
  .completion-line1{font-family:var(--serif);font-size:24px;color:var(--ink);margin:0;font-weight:600;}
  .completion-line2{font-family:var(--serif);font-style:italic;font-size:18px;color:var(--gold);margin:4px 0 0;}
  .completion-stats{font-family:var(--sans);font-size:12.5px;color:var(--ink-dim);margin:14px 0 0;}
  .detail-top h2{font-family:var(--serif);font-weight:600;font-size:26px;margin:0;}
  .close-detail{
    background:none;border:none;color:var(--ink-dim2);font-size:22px;cursor:pointer;line-height:1;padding:2px 6px;
  }
  .detail-nav{display:flex;gap:8px;margin:2px 0 18px;}
  .nav-btn{
    background:none;border:1px solid var(--line);color:var(--ink-dim2);font-family:var(--sans);
    font-size:12.5px;padding:6px 10px;border-radius:7px;cursor:pointer;
  }
  .nav-btn:hover{border-color:var(--gold-dim);color:var(--gold);}

  .section-label{
    font-family:var(--sans);font-size:12px;color:var(--navy);margin:18px 0 6px;letter-spacing:.3px;
  }
  .reading-line{font-family:var(--serif);font-size:16px;color:var(--ink);margin:2px 0;}

  .passage-block{margin:6px 0 16px;}
  .passage-title{font-family:var(--sans);font-size:13px;color:var(--gold);margin-bottom:6px;}
  .passage-text{font-family:var(--serif);font-size:calc(16.5px * var(--scripture-scale));line-height:1.7;color:var(--ink);}
  .passage-text sup{color:var(--gold);font-size:11px;margin-right:1px;}
  .passage-text .loading-text{color:var(--ink-dim2);font-style:italic;}
  .passage-text .passage-error{color:var(--ink-dim2);font-style:italic;font-size:14px;}
  .translation-credit{font-family:var(--sans);font-size:11.5px;color:var(--ink-dim);margin:4px 0 18px;text-align:right;}

  .verse-block{
    margin-top:8px;border-left:2px solid var(--gold);padding:4px 0 4px 16px;
  }
  .verse-ref{font-family:var(--sans);font-size:12.5px;color:var(--gold);margin-bottom:6px;}
  .verse-text{font-family:var(--serif);font-size:calc(18px * var(--scripture-scale));line-height:1.55;color:var(--ink);}
  .verse-text::first-letter{font-size:32px;color:var(--gold-bright);}

  .read-row{display:flex;align-items:center;gap:10px;margin:22px 0 4px;}
  .read-row input{width:17px;height:17px;accent-color:var(--gold);}
  .read-row label{font-size:14px;color:var(--ink-dim2);cursor:pointer;}

  textarea{
    width:100%;min-height:110px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
    color:var(--ink);font-family:var(--sans);font-size:14.5px;padding:12px;resize:vertical;margin-top:8px;
  }
  textarea:focus{outline:none;border-color:var(--gold-dim);}
  .save-row{display:flex;align-items:center;gap:12px;margin-top:10px;}
  .save-btn{
    background:var(--gold-bright);border:none;color:var(--navy);font-family:var(--sans);font-weight:600;font-size:13.5px;
    padding:9px 18px;border-radius:8px;cursor:pointer;
  }
  .saved-flag{font-size:12.5px;color:var(--navy);opacity:0;transition:opacity .3s ease;}
  .saved-flag.show{opacity:1;}

  footer{text-align:center;color:var(--ink-dim);font-size:12px;padding:26px 0 10px;}

  .header-controls{
    display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
    margin-top:16px;
  }
  .icon-btn{
    background:var(--surface);border:1px solid var(--line);color:var(--ink);
    font-family:var(--sans);font-size:14px;padding:8px 11px;border-radius:8px;cursor:pointer;
    display:inline-flex;align-items:center;gap:4px;line-height:1;
  }
  .icon-btn:hover{border-color:var(--gold-dim);}
  .font-size-group{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .font-size-group button{
    background:var(--surface);border:none;color:var(--ink);font-family:var(--sans);
    font-size:13px;padding:8px 12px;cursor:pointer;
  }
  .font-size-group button+button{border-left:1px solid var(--line);}
  .header-controls-right{display:flex;gap:8px;align-items:center;}

  .favorites-btn{
    background:none;border:1px solid var(--gold-dim);color:var(--gold);font-family:var(--sans);
    font-size:13px;padding:7px 13px;border-radius:8px;cursor:pointer;white-space:nowrap;
  }
  .favorites-btn:hover{background:rgba(217,178,107,0.12);}

  .streak-row{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap;}
  .streak-badge{
    display:inline-flex;align-items:center;gap:6px;background:rgba(217,178,107,0.22);
    border:1px solid var(--gold-dim);color:var(--gold);font-family:var(--sans);font-size:13px;
    padding:5px 13px;border-radius:999px;white-space:nowrap;
  }
  .encouragement{font-family:var(--serif);font-style:italic;font-size:13.5px;color:var(--ink-dim);}

  .verse-actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;}
  .verse-action-btn{
    background:none;border:1px solid var(--line);color:var(--ink-dim);font-family:var(--sans);
    font-size:12.5px;padding:7px 12px;border-radius:7px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;
  }
  .verse-action-btn.active{border-color:var(--gold);color:var(--gold);background:rgba(217,178,107,0.15);}
  .verse-action-btn:hover{border-color:var(--gold-dim);}

  .favorites-list{display:flex;flex-direction:column;gap:12px;}
  .favorite-card{
    background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:16px 18px;cursor:pointer;
    transition:box-shadow .2s ease;
  }
  .favorite-card:hover{border-color:var(--gold-dim);box-shadow:0 2px 14px rgba(16,24,39,0.06);}
  .favorite-card .fav-ref{font-family:var(--sans);font-size:12px;color:var(--gold);margin-bottom:4px;}
  .favorite-card .fav-text{font-family:var(--serif);font-size:15px;color:var(--ink);line-height:1.5;}
  .favorite-card .fav-day{font-family:var(--sans);font-size:11.5px;color:var(--ink-dim);margin-top:6px;}
  .empty-state{color:var(--ink-dim);font-family:var(--sans);font-size:14px;padding:20px 4px;text-align:center;line-height:1.6;}

  .see-also{margin-top:16px;}
  .see-also-chip{
    background:none;border:1px dashed var(--gold-dim);color:var(--gold);font-family:var(--sans);
    font-size:12.5px;padding:6px 12px;border-radius:7px;cursor:pointer;
  }
  .see-also-text{
    font-family:var(--serif);font-size:14.5px;color:var(--ink);margin-top:8px;padding-left:12px;
    border-left:2px solid var(--gold-dim);line-height:1.5;
  }

  .settings-field{margin:16px 0;}
  .settings-field label{display:block;font-family:var(--sans);font-size:13px;color:var(--ink-dim);margin-bottom:8px;}
  .settings-field input[type="date"]{
    background:var(--surface-2);border:1px solid var(--line);border-radius:8px;color:var(--ink);
    font-family:var(--sans);font-size:14px;padding:9px 12px;width:100%;
  }
  .settings-row{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;}
  .settings-btn{
    background:var(--surface-2);border:1px solid var(--line);color:var(--ink);font-family:var(--sans);
    font-size:13px;padding:9px 14px;border-radius:8px;cursor:pointer;
  }
  .settings-btn:hover{border-color:var(--gold-dim);}
  .settings-btn.danger{border-color:rgba(180,60,60,0.4);color:#B4453C;}
  .settings-btn.primary{background:var(--gold-bright);border:none;color:var(--navy);font-weight:600;}
  .settings-note{font-family:var(--sans);font-size:12px;color:var(--ink-dim);margin-top:6px;}

  .share-image-preview{max-width:100%;border-radius:12px;margin-top:12px;display:block;}

  .social-share-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;}
  .social-btn{
    width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    text-decoration:none;font-size:19px;border:1px solid var(--line);color:#fff;flex-shrink:0;
  }
  .social-btn.whatsapp{background:#25D366;}
  .social-btn.facebook{background:#1877F2;}
  .social-btn.x{background:#000;}
  .social-btn.threads{background:#000;}

  .chat-fab{
    position:fixed;bottom:22px;right:22px;width:56px;height:56px;border-radius:50%;
    background:var(--gold-bright);border:none;color:var(--navy);font-size:24px;cursor:pointer;
    box-shadow:0 4px 14px rgba(27,58,92,0.25);z-index:50;display:flex;align-items:center;justify-content:center;
  }
  .chat-panel{
    position:fixed;bottom:22px;right:22px;width:340px;max-width:calc(100vw - 32px);height:460px;
    max-height:calc(100vh - 100px);background:var(--surface);border:1px solid var(--line);border-radius:16px;
    box-shadow:0 8px 30px rgba(27,58,92,0.25);z-index:50;display:flex;flex-direction:column;overflow:hidden;
  }
  .chat-header{
    display:flex;justify-content:space-between;align-items:center;padding:14px 16px;
    border-bottom:1px solid var(--line);background:var(--navy);color:#F5F0E6;
  }
  .chat-header span{font-family:var(--serif);font-size:15px;}
  .chat-header button{background:none;border:none;color:#F5F0E6;font-size:20px;cursor:pointer;line-height:1;}
  .chat-messages{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px;}
  .chat-msg{font-family:var(--sans);font-size:13.5px;line-height:1.5;max-width:88%;padding:9px 12px;border-radius:12px;}
  .chat-msg.user{align-self:flex-end;background:var(--gold-bright);color:var(--navy);border-bottom-right-radius:3px;}
  .chat-msg.assistant{align-self:flex-start;background:var(--surface-2);color:var(--ink);border-bottom-left-radius:3px;}
  .chat-msg.typing{font-style:italic;color:var(--ink-dim);}
  .chat-input-row{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);}
  .chat-input-row input{
    flex:1;background:var(--surface-2);border:1px solid var(--line);border-radius:20px;
    color:var(--ink);font-family:var(--sans);font-size:13.5px;padding:9px 14px;
  }
  .chat-input-row button{
    background:var(--navy);border:none;color:#F5F0E6;border-radius:50%;width:36px;height:36px;
    cursor:pointer;font-size:15px;flex-shrink:0;
  }

  @media print{
    body,#app,.day-detail{background:#fff !important;}
    .header-controls,.streak-row,.tagline,.lang-toggle,.month-rail,.day-grid,.today-jump,.view-toggle,.year-heatmap,.continue-card,.search-row,
    .close-detail,.detail-nav,.read-row,.save-row,.verse-actions,.favorites-btn,footer,
    .brand img,.see-also-chip{ display:none !important; }
    * { color:#000 !important; border-color:#ccc !important; box-shadow:none !important; }
    textarea{background:#fff !important;}
    .day-detail{border:none;padding:0;}
  }

  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important;}
  }
</style>
</head>
<body style="background:#F8F5EE;">
<div id="app" style="background:#F8F5EE;">
  <header class="topbar">

  const VERSES = [
    {ref:{fr:"Jean 3.16",en:"John 3:16"},fr:"Car Dieu a tant aimé le monde qu'il a donné son Fils unique, afin que quiconque croit en lui ne périsse point, mais qu'il ait la vie éternelle.",en:"For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life.",related:{usfm:"ROM",chapter:5,verse:8}},
    {ref:{fr:"Psaume 23.1",en:"Psalm 23:1"},fr:"L'Éternel est mon berger: je ne manquerai de rien.",en:"The LORD is my shepherd; I shall not want.",related:{usfm:"JHN",chapter:10,verse:11}},
    {ref:{fr:"Philippiens 4.13",en:"Philippians 4:13"},fr:"Je puis tout par celui qui me fortifie.",en:"I can do all things through Christ which strengtheneth me.",related:{usfm:"2CO",chapter:12,verse:9}},
    {ref:{fr:"Jérémie 29.11",en:"Jeremiah 29:11"},fr:"Car je connais les projets que j'ai formés sur vous, dit l'Éternel, projets de paix et non de malheur, afin de vous donner un avenir et de l'espérance.",en:"For I know the thoughts that I think toward you, saith the LORD, thoughts of peace, and not of evil, to give you an expected end.",related:{usfm:"ROM",chapter:8,verse:28}},
    {ref:{fr:"Romains 8.28",en:"Romans 8:28"},fr:"Nous savons, du reste, que toutes choses concourent au bien de ceux qui aiment Dieu, de ceux qui sont appelés selon son dessein.",en:"And we know that all things work together for good to them that love God, to them who are the called according to his purpose.",related:{usfm:"GEN",chapter:50,verse:20}},
    {ref:{fr:"Proverbes 3.5-6",en:"Proverbs 3:5-6"},fr:"Confie-toi en l'Éternel de tout ton cœur, et ne t'appuie pas sur ta sagesse; reconnais-le dans toutes tes voies, et il aplanira tes sentiers.",en:"Trust in the LORD with all thine heart; and lean not unto thine own understanding. In all thy ways acknowledge him, and he shall direct thy paths.",related:{usfm:"PSA",chapter:37,verse:5}},
    {ref:{fr:"Josué 1.9",en:"Joshua 1:9"},fr:"Ne t'ai-je pas donné cet ordre: Fortifie-toi et prends courage? Ne t'effraie point et ne t'épouvante point, car l'Éternel, ton Dieu, est avec toi partout où tu iras.",en:"Have not I commanded thee? Be strong and of a good courage; be not afraid, neither be thou dismayed: for the LORD thy God is with thee whithersoever thou goest.",related:{usfm:"DEU",chapter:31,verse:6}},
    {ref:{fr:"Ésaïe 41.10",en:"Isaiah 41:10"},fr:"Ne crains rien, car je suis avec toi; ne prends pas d'inquiétude, car je suis ton Dieu; je te fortifie, je viens à ton secours, je te soutiens de ma droite juste.",en:"Fear thou not; for I am with thee: be not dismayed; for I am thy God: I will strengthen thee; yea, I will help thee; yea, I will uphold thee with the right hand of my righteousness.",related:{usfm:"PSA",chapter:27,verse:1}},
    {ref:{fr:"Matthieu 6.33",en:"Matthew 6:33"},fr:"Cherchez premièrement le royaume et la justice de Dieu; et toutes ces choses vous seront données par-dessus.",en:"But seek ye first the kingdom of God, and his righteousness; and all these things shall be added unto you.",related:{usfm:"PSA",chapter:37,verse:4}},
    {ref:{fr:"Psaume 46.1",en:"Psalm 46:1"},fr:"Dieu est pour nous un refuge et un appui, un secours qui ne manque jamais dans la détresse.",en:"God is our refuge and strength, a very present help in trouble.",related:{usfm:"ISA",chapter:41,verse:10}},
    {ref:{fr:"Romains 12.2",en:"Romans 12:2"},fr:"Ne vous conformez pas au siècle présent, mais soyez transformés par le renouvellement de l'intelligence, afin que vous discerniez quelle est la volonté de Dieu.",en:"And be not conformed to this world: but be ye transformed by the renewing of your mind, that ye may prove what is that good, and acceptable, and perfect, will of God.",related:{usfm:"EPH",chapter:4,verse:23}},
    {ref:{fr:"Galates 2.20",en:"Galatians 2:20"},fr:"J'ai été crucifié avec Christ; et si je vis, ce n'est plus moi qui vis, c'est Christ qui vit en moi.",en:"I am crucified with Christ: nevertheless I live; yet not I, but Christ liveth in me.",related:{usfm:"2CO",chapter:5,verse:17}},
    {ref:{fr:"Psaume 119.105",en:"Psalm 119:105"},fr:"Ta parole est une lampe à mes pieds, et une lumière sur mon sentier.",en:"Thy word is a lamp unto my feet, and a light unto my path.",related:{usfm:"PRO",chapter:6,verse:23}},
    {ref:{fr:"2 Corinthiens 5.17",en:"2 Corinthians 5:17"},fr:"Si quelqu'un est en Christ, il est une nouvelle créature. Les choses vieilles sont passées; voici, toutes choses sont devenues nouvelles.",en:"Therefore if any man be in Christ, he is a new creature: old things are passed away; behold, all things are become new.",related:{usfm:"EZK",chapter:36,verse:26}},
    {ref:{fr:"Éphésiens 2.8-9",en:"Ephesians 2:8-9"},fr:"Car c'est par la grâce que vous êtes sauvés, par le moyen de la foi. Et cela ne vient pas de vous, c'est le don de Dieu. Ce n'est point par les œuvres, afin que personne ne se glorifie.",en:"For by grace are ye saved through faith; and that not of yourselves: it is the gift of God: Not of works, lest any man should boast.",related:{usfm:"ROM",chapter:3,verse:24}},
    {ref:{fr:"Hébreux 11.1",en:"Hebrews 11:1"},fr:"Or la foi est une ferme assurance des choses qu'on espère, une démonstration de celles qu'on ne voit pas.",en:"Now faith is the substance of things hoped for, the evidence of things not seen.",related:{usfm:"HEB",chapter:11,verse:6}},
    {ref:{fr:"1 Pierre 5.7",en:"1 Peter 5:7"},fr:"Et déchargez-vous sur lui de tous vos soucis, car lui-même prend soin de vous.",en:"Casting all your care upon him; for he careth for you.",related:{usfm:"PHP",chapter:4,verse:6}},
    {ref:{fr:"1 Jean 4.19",en:"1 John 4:19"},fr:"Pour nous, nous l'aimons, parce qu'il nous a aimés le premier.",en:"We love him, because he first loved us.",related:{usfm:"JHN",chapter:3,verse:16}},
    {ref:{fr:"Psaume 27.1",en:"Psalm 27:1"},fr:"L'Éternel est ma lumière et mon salut: de qui aurais-je crainte? L'Éternel est le soutien de ma vie: de qui aurais-je peur?",en:"The LORD is my light and my salvation; whom shall I fear? the LORD is the strength of my life; of whom shall I be afraid?",related:{usfm:"PSA",chapter:46,verse:1}},
    {ref:{fr:"Matthieu 11.28",en:"Matthew 11:28"},fr:"Venez à moi, vous tous qui êtes fatigués et chargés, et je vous donnerai du repos.",en:"Come unto me, all ye that labour and are heavy laden, and I will give you rest.",related:{usfm:"PSA",chapter:62,verse:1}},
    {ref:{fr:"Jean 14.6",en:"John 14:6"},fr:"Jésus lui dit: Je suis le chemin, la vérité, et la vie. Nul ne vient au Père que par moi.",en:"Jesus saith unto him, I am the way, the truth, and the life: no man cometh unto the Father, but by me.",related:{usfm:"JHN",chapter:10,verse:9}},
    {ref:{fr:"Romains 5.8",en:"Romans 5:8"},fr:"Mais Dieu prouve son amour envers nous, en ce que, lorsque nous étions encore des pécheurs, Christ est mort pour nous.",en:"But God commendeth his love toward us, in that, while we were yet sinners, Christ died for us.",related:{usfm:"JHN",chapter:3,verse:16}},
    {ref:{fr:"Philippiens 4.6-7",en:"Philippians 4:6-7"},fr:"Ne vous inquiétez de rien; mais en toute chose faites connaître vos besoins à Dieu par des prières et des supplications, avec des actions de grâces. Et la paix de Dieu, qui surpasse toute intelligence, gardera vos cœurs et vos pensées en Jésus-Christ.",en:"Be careful for nothing; but in every thing by prayer and supplication with thanksgiving let your requests be made known unto God. And the peace of God, which passeth all understanding, shall keep your hearts and minds through Christ Jesus.",related:{usfm:"1PE",chapter:5,verse:7}},
    {ref:{fr:"Ésaïe 40.31",en:"Isaiah 40:31"},fr:"Mais ceux qui se confient en l'Éternel renouvellent leur force. Ils prennent le vol comme les aigles; ils courent, et ne se lassent point, ils marchent, et ne se fatiguent point.",en:"But they that wait upon the LORD shall renew their strength; they shall mount up with wings as eagles; they shall run, and not be weary; and they shall walk, and not faint.",related:{usfm:"PSA",chapter:103,verse:5}},
    {ref:{fr:"Psaume 34.8",en:"Psalm 34:8"},fr:"Sentez et voyez combien l'Éternel est bon! Heureux l'homme qui cherche en lui son refuge!",en:"O taste and see that the LORD is good: blessed is the man that trusteth in him.",related:{usfm:"1PE",chapter:2,verse:3}},
    {ref:{fr:"Proverbes 16.3",en:"Proverbs 16:3"},fr:"Recommande à l'Éternel tes œuvres, et tes projets réussiront.",en:"Commit thy works unto the LORD, and thy thoughts shall be established.",related:{usfm:"PSA",chapter:37,verse:5}},
    {ref:{fr:"Matthieu 28.19-20",en:"Matthew 28:19-20"},fr:"Allez, faites de toutes les nations des disciples, les baptisant au nom du Père, du Fils et du Saint-Esprit, et enseignez-leur à observer tout ce que je vous ai prescrit. Et voici, je suis avec vous tous les jours, jusqu'à la fin du monde.",en:"Go ye therefore, and teach all nations, baptizing them in the name of the Father, and of the Son, and of the Holy Ghost: Teaching them to observe all things whatsoever I have commanded you: and, lo, I am with you alway, even unto the end of the world.",related:{usfm:"ACT",chapter:1,verse:8}},
    {ref:{fr:"Luc 1.37",en:"Luke 1:37"},fr:"Car rien n'est impossible à Dieu.",en:"For with God nothing shall be impossible.",related:{usfm:"MAT",chapter:19,verse:26}},
    {ref:{fr:"Deutéronome 31.6",en:"Deuteronomy 31:6"},fr:"Fortifiez-vous et ayez du courage! Ne craignez point et ne soyez point effrayés devant eux; car l'Éternel, ton Dieu, marchera lui-même avec toi, il ne te délaissera point, il ne t'abandonnera point.",en:"Be strong and of a good courage, fear not, nor be afraid of them: for the LORD thy God, he it is that doth go with thee; he will not fail thee, nor forsake thee.",related:{usfm:"JOS",chapter:1,verse:9}},
    {ref:{fr:"Psaume 91.1-2",en:"Psalm 91:1-2"},fr:"Celui qui demeure sous l'abri du Très-Haut repose à l'ombre du Tout-Puissant. Je dis à l'Éternel: Mon refuge et ma forteresse, mon Dieu en qui je me confie!",en:"He that dwelleth in the secret place of the most High shall abide under the shadow of the Almighty. I will say of the LORD, He is my refuge and my fortress: my God; in him will I trust.",related:{usfm:"PSA",chapter:46,verse:1}},
    {ref:{fr:"Colossiens 3.23",en:"Colossians 3:23"},fr:"Tout ce que vous faites, faites-le de bon cœur, comme pour le Seigneur et non pour des hommes.",en:"And whatsoever ye do, do it heartily, as to the Lord, and not unto men.",related:{usfm:"EPH",chapter:6,verse:7}},
    {ref:{fr:"2 Timothée 1.7",en:"2 Timothy 1:7"},fr:"Car ce n'est pas un esprit de timidité que Dieu nous a donné, mais un esprit de force, d'amour et de sagesse.",en:"For God hath not given us the spirit of fear; but of power, and of love, and of a sound mind.",related:{usfm:"ROM",chapter:8,verse:15}},
    {ref:{fr:"1 Corinthiens 10.13",en:"1 Corinthians 10:13"},fr:"Aucune tentation ne vous est survenue qui n'ait été humaine, et Dieu, qui est fidèle, ne permettra pas que vous soyez tentés au-delà de vos forces; mais avec la tentation il préparera aussi le moyen d'en sortir, afin que vous puissiez la supporter.",en:"There hath no temptation taken you but such as is common to man: but God is faithful, who will not suffer you to be tempted above that ye are able; but will with the temptation also make a way to escape, that ye may be able to bear it.",related:{usfm:"JAS",chapter:1,verse:2}},
    {ref:{fr:"Psaume 37.4",en:"Psalm 37:4"},fr:"Fais de l'Éternel tes délices, et il te donnera ce que ton cœur désire.",en:"Delight thyself also in the LORD; and he shall give thee the desires of thine heart.",related:{usfm:"MAT",chapter:6,verse:33}},
    {ref:{fr:"Jean 8.32",en:"John 8:32"},fr:"Vous connaîtrez la vérité, et la vérité vous affranchira.",en:"And ye shall know the truth, and the truth shall make you free.",related:{usfm:"JHN",chapter:14,verse:6}},
    {ref:{fr:"Psaume 121.1-2",en:"Psalm 121:1-2"},fr:"Je lève mes yeux vers les montagnes: d'où me viendra le secours? Le secours me vient de l'Éternel, qui a fait les cieux et la terre.",en:"I will lift up mine eyes unto the hills, from whence cometh my help. My help cometh from the LORD, which made heaven and earth.",related:{usfm:"PSA",chapter:124,verse:8}},
    {ref:{fr:"Marc 11.24",en:"Mark 11:24"},fr:"C'est pourquoi je vous dis: Tout ce que vous demanderez en priant, croyez que vous l'avez reçu, et vous le verrez s'accomplir.",en:"Therefore I say unto you, What things soever ye desire, when ye pray, believe that ye receive them, and ye shall have them.",related:{usfm:"MAT",chapter:21,verse:22}},
    {ref:{fr:"Jacques 1.2-3",en:"James 1:2-3"},fr:"Mes frères, regardez comme un sujet de joie complète les diverses épreuves auxquelles vous pouvez être exposés, sachant que l'épreuve de votre foi produit la patience.",en:"My brethren, count it all joy when ye fall into divers temptations; Knowing this, that the trying of your faith worketh patience.",related:{usfm:"ROM",chapter:5,verse:3}},
    {ref:{fr:"Psaume 139.14",en:"Psalm 139:14"},fr:"Je te loue de ce que je suis une créature si merveilleuse. Tes œuvres sont admirables, et mon âme le reconnaît bien.",en:"I will praise thee; for I am fearfully and wonderfully made: marvellous are thy works; and that my soul knoweth right well.",related:{usfm:"GEN",chapter:1,verse:27}},
    {ref:{fr:"Actes 1.8",en:"Acts 1:8"},fr:"Mais vous recevrez une puissance, le Saint-Esprit survenant sur vous, et vous serez mes témoins à Jérusalem, dans toute la Judée, dans la Samarie, et jusqu'aux extrémités de la terre.",en:"But ye shall receive power, after that the Holy Ghost is come upon you: and ye shall be witnesses unto me both in Jerusalem, and in all Judaea, and in Samaria, and unto the uttermost part of the earth.",related:{usfm:"MAT",chapter:28,verse:19}},
    {ref:{fr:"Romains 10.9",en:"Romans 10:9"},fr:"Si tu confesses de ta bouche le Seigneur Jésus, et si tu crois dans ton cœur que Dieu l'a ressuscité des morts, tu seras sauvé.",en:"That if thou shalt confess with thy mouth the Lord Jesus, and shalt believe in thine heart that God hath raised him from the dead, thou shalt be saved.",related:{usfm:"ROM",chapter:10,verse:13}},
    {ref:{fr:"Psaume 51.10",en:"Psalm 51:10"},fr:"O Dieu! crée en moi un cœur pur, renouvelle en moi un esprit bien disposé.",en:"Create in me a clean heart, O God; and renew a right spirit within me.",related:{usfm:"EZK",chapter:36,verse:26}},
    {ref:{fr:"Ésaïe 26.3",en:"Isaiah 26:3"},fr:"A celui qui est ferme dans ses sentiments tu assures la paix, la paix, parce qu'il se confie en toi.",en:"Thou wilt keep him in perfect peace, whose mind is stayed on thee: because he trusteth in thee.",related:{usfm:"PHP",chapter:4,verse:6}},
    {ref:{fr:"1 Corinthiens 13.4",en:"1 Corinthians 13:4"},fr:"La charité est patiente, elle est pleine de bonté; la charité n'est point envieuse; la charité ne se vante point, elle ne s'enfle point d'orgueil.",en:"Charity suffereth long, and is kind; charity envieth not; charity vaunteth not itself, is not puffed up.",related:{usfm:"1CO",chapter:13,verse:13}},
    {ref:{fr:"Néhémie 8.10",en:"Nehemiah 8:10"},fr:"Ne vous affligez pas, car la joie de l'Éternel sera votre force.",en:"Neither be ye sorry; for the joy of the LORD is your strength.",related:{usfm:"PSA",chapter:16,verse:11}},
    {ref:{fr:"Psaume 143.8",en:"Psalm 143:8"},fr:"Fais-moi entendre dès le matin ta bonté! Car je me confie en toi.",en:"Cause me to hear thy lovingkindness in the morning; for in thee do I trust.",related:{usfm:"LAM",chapter:3,verse:22}},
    {ref:{fr:"Marc 10.27",en:"Mark 10:27"},fr:"Jésus les regarda, et dit: Cela est impossible aux hommes, mais non à Dieu: car tout est possible à Dieu.",en:"And Jesus looking upon them saith, With men it is impossible, but not with God: for with God all things are possible.",related:{usfm:"LUK",chapter:1,verse:37}},
    {ref:{fr:"Psaume 103.2-3",en:"Psalm 103:2-3"},fr:"Mon âme, bénis l'Éternel, et n'oublie aucun de ses bienfaits! C'est lui qui pardonne toutes tes iniquités, qui guérit toutes tes maladies.",en:"Bless the LORD, O my soul, and forget not all his benefits: Who forgiveth all thine iniquities; who healeth all thy diseases.",related:{usfm:"ISA",chapter:53,verse:5}},
    {ref:{fr:"Ézéchiel 36.26",en:"Ezekiel 36:26"},fr:"Je vous donnerai un cœur nouveau, et je mettrai en vous un esprit nouveau; j'ôterai de votre corps le cœur de pierre, et je vous donnerai un cœur de chair.",en:"A new heart also will I give you, and a new spirit will I put within you: and I will take away the stony heart out of your flesh, and I will give you an heart of flesh.",related:{usfm:"2CO",chapter:5,verse:17}},
    {ref:{fr:"Apocalypse 3.20",en:"Revelation 3:20"},fr:"Voici, je me tiens à la porte, et je frappe. Si quelqu'un entend ma voix et ouvre la porte, j'entrerai chez lui, je souperai avec lui, et lui avec moi.",en:"Behold, I stand at the door, and knock: if any man hear my voice, and open the door, I will come in to him, and will sup with him, and he with me.",related:{usfm:"JHN",chapter:14,verse:23}},
    {ref:{fr:"Psaume 16.11",en:"Psalm 16:11"},fr:"Tu me feras connaître le sentier de la vie; il y a d'abondantes joies devant ta face, des délices éternelles à ta droite.",en:"Thou wilt shew me the path of life: in thy presence is fulness of joy; at thy right hand there are pleasures for evermore.",related:{usfm:"JHN",chapter:15,verse:11}},
    {ref:{fr:"Jean 15.5",en:"John 15:5"},fr:"Je suis le cep, vous êtes les sarments. Celui qui demeure en moi et en qui je demeure porte beaucoup de fruit, car sans moi vous ne pouvez rien faire.",en:"I am the vine, ye are the branches: He that abideth in me, and I in him, the same bringeth forth much fruit: for without me ye can do nothing.",related:{usfm:"PHP",chapter:4,verse:13}},
    {ref:{fr:"Psaume 30.5",en:"Psalm 30:5"},fr:"Car sa colère dure un instant, mais sa grâce toute la vie; le soir arrivent les pleurs, et le matin l'allégresse.",en:"For his anger endureth but a moment; in his favour is life: weeping may endure for a night, but joy cometh in the morning.",related:{usfm:"ISA",chapter:61,verse:3}},
    {ref:{fr:"Michée 6.8",en:"Micah 6:8"},fr:"On t'a fait connaître, ô homme, ce qui est bien; et ce que l'Éternel demande de toi, c'est que tu pratiques la justice, que tu aimes la miséricorde, et que tu marches humblement avec ton Dieu.",en:"He hath shewed thee, O man, what is good; and what doth the LORD require of thee, but to do justly, and to love mercy, and to walk humbly with thy God?",related:{usfm:"HOS",chapter:6,verse:6}},
    {ref:{fr:"Sophonie 3.17",en:"Zephaniah 3:17"},fr:"L'Éternel, ton Dieu, est au milieu de toi, comme un héros qui sauve; il fera de toi sa plus grande joie.",en:"The LORD thy God in the midst of thee is mighty; he will save, he will rejoice over thee with joy.",related:{usfm:"ROM",chapter:8,verse:31}},
    {ref:{fr:"Psaume 62.1",en:"Psalm 62:1"},fr:"Oui, c'est en Dieu que mon âme se confie; de lui vient mon salut.",en:"Truly my soul waiteth upon God: from him cometh my salvation.",related:{usfm:"PSA",chapter:46,verse:1}},
    {ref:{fr:"Jean 16.33",en:"John 16:33"},fr:"Je vous ai dit ces choses, afin que vous ayez la paix en moi. Vous aurez des tribulations dans le monde; mais prenez courage, j'ai vaincu le monde.",en:"These things I have spoken unto you, that in me ye might have peace. In the world ye shall have tribulation: but be of good cheer; I have overcome the world.",related:{usfm:"1JN",chapter:5,verse:4}},
    {ref:{fr:"Psaume 118.24",en:"Psalm 118:24"},fr:"C'est ici la journée que l'Éternel a faite: qu'elle soit pour nous un sujet d'allégresse et de joie!",en:"This is the day which the LORD hath made; we will rejoice and be glad in it.",related:{usfm:"LAM",chapter:3,verse:23}},
    {ref:{fr:"Habacuc 3.19",en:"Habakkuk 3:19"},fr:"L'Éternel, le Seigneur, est ma force; il rend mes pieds semblables à ceux des biches, et il me fait marcher sur mes lieux élevés.",en:"The LORD God is my strength, and he will make my feet like hinds' feet, and he will make me to walk upon mine high places.",related:{usfm:"PSA",chapter:18,verse:33}},
    {ref:{fr:"Colossiens 3.2",en:"Colossians 3:2"},fr:"Affectionnez-vous aux choses d'en haut, et non à celles qui sont sur la terre.",en:"Set your affection on things above, not on things on the earth.",related:{usfm:"PHP",chapter:3,verse:20}}

  const MONTH_LENGTHS = [31,28,31,30,31,30,31,31,30,31,30,31];
  const TOTAL_DAYS = 365;

  // ---------- BUILD READING PLAN ----------
  function flatten(bookList){
    const out=[];
    bookList.forEach(b=>{ for(let c=1;c<=b.ch;c++) out.push({book:{fr:b.fr,en:b.en,usfm:b.usfm},chapter:c}); });
    return out;
  }
  function distribute(total, days){
    const counts=new Array(days).fill(0);
    for(let d=0; d<days; d++){
      counts[d] = Math.floor((d+1)*total/days) - Math.floor(d*total/days);
    }
    return counts;
  }
  const otFlat = flatten(otBooks);
  const ntFlat = flatten(ntBooks);
  const otCounts = distribute(otFlat.length, TOTAL_DAYS);
  const ntCounts = distribute(ntFlat.length, TOTAL_DAYS);
  const otOffsets=[0], ntOffsets=[0];
  for(let i=1;i<TOTAL_DAYS;i++){
    otOffsets[i]=otOffsets[i-1]+otCounts[i-1];
    ntOffsets[i]=ntOffsets[i-1]+ntCounts[i-1];
  }

  function getReadingsForDay(dayIndex0){
    const ot = otFlat.slice(otOffsets[dayIndex0], otOffsets[dayIndex0]+otCounts[dayIndex0]);
    const nt = ntFlat.slice(ntOffsets[dayIndex0], ntOffsets[dayIndex0]+ntCounts[dayIndex0]);
    const psalmCh = (dayIndex0 % 150) + 1;
    const provCh = (dayIndex0 % 31) + 1;
    return {
      ot: ot, nt: nt,
      psalm: {book:PSALM_BOOK, chapter:psalmCh},
      proverb: {book:PROV_BOOK, chapter:provCh}
    };
  }
  function formatEntries(entries, lang){
    if(!entries.length) return null;
    const parts=[];
    let curBook = entries[0].book[lang], start=entries[0].chapter, end=start;
    for(let i=1;i<entries.length;i++){
      const e=entries[i], bn=e.book[lang];
      if(bn===curBook && e.chapter===end+1){ end=e.chapter; }
      else { parts.push(curBook+" "+(start===end?start:start+"–"+end)); curBook=bn; start=e.chapter; end=e.chapter; }
    }
    parts.push(curBook+" "+(start===end?start:start+"–"+end));
    return parts.join("; ");
  }

  // month start offsets (0-based day index of first day of month)
  const monthStart=[0];
  for(let i=1;i<12;i++) monthStart[i]=monthStart[i-1]+MONTH_LENGTHS[i-1];

  // ---------- BIBLE TEXT (live, public-domain source) ----------
  const BIBLE_API = "https://bible.helloao.org/api";
  let translationIds = { fr: null, en: null };
  let translationNames = { fr: "", en: "" };
  const chapterCache = {}; // key: `${translationId}/${usfm}/${chapter}` -> [{number,text}] or 'error'

  async function loadTranslations(){
    try{
      const res = await fetch(BIBLE_API + "/available_translations.json");
      const data = await res.json();
      const list = data.translations || [];
      const fra = list.filter(t => t.language === "fra");
      const eng = list.filter(t => t.language === "eng");
      let fr = fra.find(t => /segond/i.test(t.name+t.englishName) && /1910/.test(t.name+t.englishName))
            || fra.find(t => /segond/i.test(t.name+t.englishName))
            || fra[0];
      let en = eng.find(t => t.id === "BSB") || eng.find(t => /berean/i.test(t.englishName)) || eng.find(t => t.id === "KJV") || eng[0];
      if(fr){ translationIds.fr = fr.id; translationNames.fr = fr.name || fr.englishName; }
      if(en){ translationIds.en = en.id; translationNames.en = en.name || en.englishName; }
    }catch(e){
      // fall back to common defaults; individual fetches will simply show an error if wrong
      translationIds.fr = translationIds.fr || "LSG";
      translationIds.en = translationIds.en || "BSB";
    }
  }

  async function fetchChapter(lang2, usfm, chapterNum){
    const tId = translationIds[lang2];
    if(!tId) return { error:true };
    const key = tId+"/"+usfm+"/"+chapterNum;
    if(chapterCache[key]) return chapterCache[key];
    try{
      const res = await fetch(`${BIBLE_API}/${tId}/${usfm}/${chapterNum}.simple.json`);
      if(!res.ok) throw new Error("bad status");
      const data = await res.json();
      const verses = (data.chapter && data.chapter.content || [])
        .filter(c => c.type === "verse")
        .map(c => ({ number:c.number, text:c.text }));
      const result = { verses };
      chapterCache[key] = result;
      return result;
    }catch(e){
      const result = { error:true };
      chapterCache[key] = result;
      return result;
    }
  }

  function renderVerses(verses){
    return verses.map(v => `<sup>${v.number}</sup> ${v.text}`).join(" ");
  }

  async function fetchVerse(lang2, usfm, chapterNum, verseNum){
    const result = await fetchChapter(lang2, usfm, chapterNum);
    if(result.error || !result.verses) return { error:true };
    const v = result.verses.find(x => x.number === verseNum);
    return v ? { text:v.text } : { error:true };
  }

  function collectReadableText(){
    const parts = [];
    document.querySelectorAll('#dayDetail .passage-text').forEach(el=>{
      const clone = el.cloneNode(true);
      clone.querySelectorAll('sup').forEach(s=>s.remove());
      const txt = clone.textContent.trim();
      if(txt) parts.push(txt);
    });
    const verseEl = document.querySelector('#dayDetail .verse-text');
    if(verseEl){
      const txt = verseEl.textContent.trim();
      if(txt) parts.push(txt);
    }
    return parts.join('. ');
  }

  function updateListenBtn(isSpeaking){
    const btn = $('listenBtn');
    if(!btn) return;
    btn.textContent = isSpeaking ? UI[lang].listenStop : UI[lang].listenStart;
  }

  function stopSpeech(){
    if('speechSynthesis' in window && window.speechSynthesis.speaking){
      window.speechSynthesis.cancel();
    }
    updateListenBtn(false);
  }

  function toggleSpeech(n){
    if(!('speechSynthesis' in window)){
      alert(UI[lang].listenUnsupported);
      return;
    }
    if(window.speechSynthesis.speaking){
      stopSpeech();
      return;
    }
    const text = collectReadableText();
    if(!text) return;
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = lang === 'fr' ? 'fr-FR' : 'en-US';
    utter.rate = 0.95;
    utter.onend = ()=> updateListenBtn(false);
    utter.onerror = ()=> updateListenBtn(false);
    window.speechSynthesis.speak(utter);
    updateListenBtn(true);
  }

  function loadImageAsync(src){
    return new Promise((resolve,reject)=>{
      const img = new Image();
      img.onload = ()=>resolve(img);
      img.onerror = reject;
      img.src = src;
    });
  }

  async function generateShareImage(n, verse){
    const canvas = document.getElementById('shareCanvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;

    const grad = ctx.createLinearGradient(0,0,W,H);
    grad.addColorStop(0,'#243B64');
    grad.addColorStop(1,'#101827');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);

    ctx.strokeStyle = '#D6B56A';
    ctx.lineWidth = 4;
    ctx.strokeRect(36,36,W-72,H-72);

    try{
      const logoImgEl = document.querySelector('.brand img');
      if(logoImgEl){
        const logo = await loadImageAsync(logoImgEl.src);
        const logoW = 190;
        const logoH = logoW * (logo.height/logo.width);
        ctx.drawImage(logo, (W-logoW)/2, 90, logoW, logoH);
      }
    }catch(e){ /* skip logo if unavailable */ }

    ctx.fillStyle = '#F5F0E6';
    ctx.textAlign = 'center';
    ctx.font = 'italic 44px Georgia, serif';
    const text = verse[lang];
    const maxWidth = W - 180;
    const words = text.split(' ');
    let line = '', lines = [];
    for(const word of words){
      const test = line ? line + ' ' + word : word;
      if(ctx.measureText(test).width > maxWidth && line){ lines.push(line); line = word; }
      else { line = test; }
    }
    if(line) lines.push(line);
    const lineHeight = 58;
    let startY = H/2 - (lines.length*lineHeight)/2 + 40;
    lines.forEach((l,i)=>{ ctx.fillText(l, W/2, startY + i*lineHeight); });

    ctx.fillStyle = '#D6B56A';
    ctx.font = '600 32px Avenir Next, Segoe UI, sans-serif';
    ctx.fillText(verse.ref[lang], W/2, startY + lines.length*lineHeight + 50);

    ctx.fillStyle = 'rgba(245,239,224,0.7)';
    ctx.font = '28px Avenir Next, Segoe UI, sans-serif';
    ctx.fillText('365 Grace', W/2, H-110);
    ctx.font = '20px Avenir Next, Segoe UI, sans-serif';
    ctx.fillText((lang==='fr'?'Jour ':'Day ')+n, W/2, H-70);

    return canvas;
  }

  async function generateDayCardImage(n, readingLine){
    const canvas = document.getElementById('shareCanvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;

    const grad = ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,'#243B64');
    grad.addColorStop(1,'#101827');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);

    ctx.strokeStyle = '#D6B56A';
    ctx.lineWidth = 4;
    ctx.strokeRect(36,36,W-72,H-72);

    try{
      const logoImgEl = document.querySelector('.brand img');
      if(logoImgEl){
        const logo = await loadImageAsync(logoImgEl.src);
        const logoW = 140;
        const logoH = logoW * (logo.height/logo.width);
        ctx.drawImage(logo, (W-logoW)/2, 90, logoW, logoH);
      }
    }catch(e){ /* skip logo if unavailable */ }

    ctx.textAlign = 'center';
    ctx.fillStyle = '#D6B56A';
    ctx.font = '600 30px Inter, Avenir Next, Segoe UI, sans-serif';
    ctx.fillText(lang==='fr' ? 'La Parole de Dieu pour aujourd\u2019hui' : 'God\u2019s Word for today', W/2, 300);

    ctx.fillStyle = '#F5F0E6';
    ctx.font = '700 150px Georgia, serif';
    ctx.fillText((lang==='fr'?'JOUR ':'DAY ')+n, W/2, 480);

    ctx.strokeStyle = 'rgba(214,181,106,0.6)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(W/2-90, 530);
    ctx.lineTo(W/2+90, 530);
    ctx.stroke();

    ctx.fillStyle = '#F5F0E6';
    let readFontSize = 46;
    ctx.font = `italic ${readFontSize}px Georgia, serif`;
    while(ctx.measureText(readingLine).width > W-160 && readFontSize > 26){
      readFontSize -= 2;
      ctx.font = `italic ${readFontSize}px Georgia, serif`;
    }
    ctx.fillText(readingLine, W/2, 610);

    ctx.fillStyle = 'rgba(245,239,224,0.75)';
    ctx.font = '28px Inter, Avenir Next, Segoe UI, sans-serif';
    ctx.fillText('365 Grâce', W/2, H-90);

    return canvas;
  }

  const ENCOURAGEMENTS = [
    {min:1,max:2,fr:"Bon départ !",en:"Great start!"},
    {min:3,max:6,fr:"Vous prenez le rythme !",en:"You're finding your rhythm!"},
    {min:7,max:13,fr:"Une semaine de fidélité !",en:"A full week of faithfulness!"},
    {min:14,max:29,fr:"Deux semaines, quelle constance !",en:"Two weeks — what consistency!"},

    {min:60,max:99999,fr:"Une fidélité remarquable !",en:"Remarkable faithfulness!"}
  ];
  function getEncouragement(count){
    if(!count || count<1) return "";
    const m = ENCOURAGEMENTS.find(e => count>=e.min && count<=e.max);
    return m ? m[lang] : "";
  }

  // ---------- STATE ----------
  let lang = "fr";
  let currentMonth = 0;
  let currentDetailDay = null;
  let state = { read:{}, med:{}, favorites:{}, streak:{count:0,best:0,lastDate:null}, settings:{theme:'light',scale:1,startDate:null,reminderTime:'07:00'} };

  function todayDayOfYear(){
    if(state.settings.startDate){
      const start = new Date(state.settings.startDate + 'T00:00:00');
      const now = new Date();
      const diff = Math.floor((now - start) / 86400000);
      if(diff < 0) return 1;
      return (diff % TOTAL_DAYS) + 1;
    }
    const now = new Date();
    const start = new Date(now.getFullYear(),0,0);
    const diff = now - start;
    let doy = Math.floor(diff/86400000);
    if(doy > TOTAL_DAYS) doy = TOTAL_DAYS;
    if(doy < 1) doy = 1;
    return doy;
  }

  const hasClaudeStorage = (typeof window.storage !== 'undefined');

  async function loadState(){
    try{
      let raw = null;
      if(hasClaudeStorage){
        const res = await window.storage.get('plan-progress', false);
        raw = res && res.value;
      } else {
        raw = localStorage.getItem('365grace-progress');
      }
      if(raw){
        const parsed = JSON.parse(raw);
        state.read = parsed.read || {};
        state.med = parsed.med || {};
        state.favorites = parsed.favorites || {};
        state.streak = parsed.streak || {count:0,best:0,lastDate:null};
        state.settings = Object.assign({theme:'light',scale:1,startDate:null}, parsed.settings||{});
      }
    }catch(e){ /* no saved state yet, or storage unavailable */ }
  }
  async function saveState(){
    try{
      const json = JSON.stringify(state);
      if(hasClaudeStorage){
        await window.storage.set('plan-progress', json, false);
      } else {
        localStorage.setItem('365grace-progress', json);
      }
    }catch(e){ /* storage unavailable, continue in-memory */ }
  }

  function updateStreakOnRead(){
    const todayKey = new Date().toDateString();
    const s = state.streak;
    if(s.lastDate === todayKey) return; // already counted today
    const yesterday = new Date();
    yesterday.setDate(yesterday.getDate()-1);
    if(s.lastDate === yesterday.toDateString()){
      s.count = (s.count||0) + 1;
    } else {
      s.count = 1;
    }
    s.lastDate = todayKey;
    if(s.count > (s.best||0)) s.best = s.count;
  }

  function renderMonthRail(){

    rail.innerHTML='';
    UI[lang].months.forEach((name,i)=>{
      const offset = monthStart[i];
      const len = MONTH_LENGTHS[i];
      let readCount = 0;
      for(let d=offset+1; d<=offset+len; d++){ if(state.read[d]) readCount++; }
      const pct = Math.round((readCount/len)*100);
      const btn=document.createElement('button');
      btn.className='month-btn'+(i===currentMonth?' active':'');

  function findMatchingDays(query){
    const q = query.toLowerCase();
    const allBooks = [...otBooks, ...ntBooks, PSALM_BOOK, PROV_BOOK];
    const matchedBooks = allBooks.filter(b => b.fr.toLowerCase().includes(q) || b.en.toLowerCase().includes(q));
    const results = [];
    if(matchedBooks.length){
      const usfmSet = new Set(matchedBooks.map(b=>b.usfm));
      for(let d=1; d<=TOTAL_DAYS && results.length<25; d++){
        const r = getReadingsForDay(d-1);
        const hasMatch = r.ot.some(e=>usfmSet.has(e.book.usfm)) || r.nt.some(e=>usfmSet.has(e.book.usfm))
          || usfmSet.has(r.psalm.book.usfm) || usfmSet.has(r.proverb.book.usfm);
        if(hasMatch) results.push(d);
      }
    }
    return results;
  }

  function findMatchingVerseDay(query){
    const q = query.toLowerCase();
    for(let i=0;i<VERSES.length;i++){
      const v = VERSES[i];
      if(v.ref.fr.toLowerCase().includes(q) || v.ref.en.toLowerCase().includes(q)
        || v.fr.toLowerCase().includes(q) || v.en.toLowerCase().includes(q)){
        return i+1;
      }
    }
    return null;
  }

  function pad2(n){ return String(n).padStart(2,'0'); }

  function downloadReminderICS(timeStr){
    const [hh, mm] = timeStr.split(':').map(Number);
    const now = new Date();
    const start = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hh, mm, 0);
    if(start < now) start.setDate(start.getDate()+1);
    const end = new Date(start.getTime() + 15*60000);
    const fmt = (d)=> d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate())+'T'+pad2(d.getHours())+pad2(d.getMinutes())+'00';
    const stamp = new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
    const isFr = lang === 'fr';
    const summary = isFr ? '365 Grâce — Lecture du jour' : '365 Grace — Daily reading';
    const description = isFr
      ? 'Prends quelques minutes pour ta lecture biblique du jour. https://www.365grace.online/'
      : 'Take a few minutes for your Bible reading today. https://www.365grace.online/';
    const ics = [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-//365 Grace//Reading Reminder//FR',
      'CALSCALE:GREGORIAN',
      'BEGIN:VEVENT',
      'UID:365grace-daily-reminder-'+Date.now()+'@365grace.online',
      'DTSTAMP:'+stamp,
      'DTSTART:'+fmt(start),
      'DTEND:'+fmt(end),
      'RRULE:FREQ=DAILY',
      'SUMMARY:'+summary,
      'DESCRIPTION:'+description,
      'BEGIN:VALARM',
      'TRIGGER:-PT0M',
      'ACTION:DISPLAY',
      'DESCRIPTION:'+summary,
      'END:VALARM',
      'END:VEVENT',
      'END:VCALENDAR'
    ].join('\r\n');
    const blob = new Blob([ics], {type:'text/calendar;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '365grace-rappel.ics';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  }

    $('shareBtn').onclick = async ()=>{
      const shareText = verse[lang] + " — " + verse.ref[lang] + " (365 Grace)";
      const btn = $('shareBtn');
      if(navigator.share){
        try{ await navigator.share({text:shareText, title:'365 Grace'}); }catch(e){ /* cancelled */ }
      } else if(navigator.clipboard){
        try{
          await navigator.clipboard.writeText(shareText);
          const original = btn.innerHTML;
          btn.textContent = t.shared;
          setTimeout(()=>{ btn.innerHTML = original; }, 1800);
        }catch(e){ /* clipboard unavailable */ }
      }
    };
    $('saveMedBtn').onclick = ()=>{
      state.med[n] = $('medText').value;
      saveState();
      const flag = $('savedFlag');
      flag.classList.add('show');
      setTimeout(()=>flag.classList.remove('show'), 1800);
    };

    $('shareImageBtn').onclick = async ()=>{
      const btn = $('shareImageBtn');
      const original = btn.textContent;
      btn.textContent = t.generatingImage;
      btn.disabled = true;
      try{
        const canvas = await generateShareImage(n, verse);
        canvas.toBlob(async (blob)=>{
          const preview = $('shareImagePreview');
          const url = URL.createObjectURL(blob);
          preview.src = url;
          preview.style.display = 'block';
          const file = new File([blob], '365grace-jour'+n+'.png', {type:'image/png'});
          if(navigator.canShare && navigator.canShare({files:[file]})){
            try{ await navigator.share({files:[file], title:'365 Grace', text: verse.ref[lang]}); }
            catch(e){ /* cancelled */ }
          } else {
            const a = document.createElement('a');
            a.href = url;
            a.download = '365grace-jour'+n+'.png';
            a.click();
          }
          btn.textContent = original;
          btn.disabled = false;
        }, 'image/png');
      }catch(e){
        btn.textContent = original;
        btn.disabled = false;
      }
    };

    $('dayCardBtn').onclick = async ()=>{
      const btn = $('dayCardBtn');
      const original = btn.textContent;
      btn.textContent = t.generatingImage;
      btn.disabled = true;
      const readingLine = formatEntries(readings.ot, lang)
        || formatEntries(readings.nt, lang)
        || (readings.psalm.book[lang] + ' ' + readings.psalm.chapter);
      try{
        const canvas = await generateDayCardImage(n, readingLine);
        canvas.toBlob(async (blob)=>{
          const preview = $('shareImagePreview');
          const url = URL.createObjectURL(blob);
          preview.src = url;
          preview.style.display = 'block';
          const file = new File([blob], '365grace-carte-jour'+n+'.png', {type:'image/png'});
          if(navigator.canShare && navigator.canShare({files:[file]})){
            try{ await navigator.share({files:[file], title:'365 Grace', text: readingLine}); }
            catch(e){ /* cancelled */ }
          } else {
            const a = document.createElement('a');
            a.href = url;
            a.download = '365grace-carte-jour'+n+'.png';
            a.click();
          }
          btn.textContent = original;
          btn.disabled = false;
        }, 'image/png');
      }catch(e){
        btn.textContent = original;
        btn.disabled = false;
      }
    };

    $('seeAlsoChip').onclick = async ()=>{
      const chip = $('seeAlsoChip');
      const target = $('seeAlsoText');
      chip.disabled = true;
      target.classList.add('see-also-text');
      target.innerHTML = `<span class="loading-text">${t.loadingVerse}</span>`;
      const r = verse.related;
      const result = await fetchVerse(lang, r.usfm, r.chapter, r.verse);
      if(result.error){
        target.textContent = lang==='fr' ? 'Texte indisponible pour le moment.' : 'Text unavailable right now.';
      } else {
        target.textContent = result.text;
      }
    };

    loadPassageTexts(n, otChapters, ntChapters, psalmChapter, provChapter);
  }

  async function loadPassageTexts(forDay, otChapters, ntChapters, psalmChapter, provChapter){
    const jobs = [];
    otChapters.forEach((c,i)=> jobs.push(fillPassage('ot-'+i, c.usfm, c.chapter)));
    ntChapters.forEach((c,i)=> jobs.push(fillPassage('nt-'+i, c.usfm, c.chapter)));
    jobs.push(fillPassage('psalm-0', psalmChapter.usfm, psalmChapter.chapter));
    jobs.push(fillPassage('prov-0', provChapter.usfm, provChapter.chapter));
    await Promise.all(jobs);
    if(currentDetailDay === forDay){
      const creditEl = $('translationCredit');
      if(creditEl){
        const name = lang==='fr' ? translationNames.fr : translationNames.en;
        creditEl.textContent = name ? (lang==='fr' ? 'Texte : '+name : 'Text: '+name) : '';
      }
    }
  }

  async function fillPassage(elId, usfm, chapterNum){
    const result = await fetchChapter(lang, usfm, chapterNum);
    const el = document.getElementById(elId);
    if(!el) return; // user navigated away
    if(result.error || !result.verses || !result.verses.length){
      el.innerHTML = `<span class="passage-error">${lang==='fr' ? 'Texte indisponible pour le moment.' : 'Text unavailable right now.'}</span>`;
      return;
    }
    el.innerHTML = renderVerses(result.verses);
  }

  function renderAll(){
    renderStaticText();
    renderProgress();
    renderStreak();
    renderContinueCard();
    renderMonthRail();
    updateMonthRailVisibility();
    if(currentDetailDay){ renderDetail(); }
    else if(!$('favoritesPanel').hidden){ renderFavoritesPanel(); }
    else if(!$('settingsPanel').hidden){ renderSettingsPanel(); }
    else if(!$('reflectionsPanel').hidden){ renderReflectionsPanel(); }
    else if(!$('searchPanel').hidden){ /* keep current results, no live re-search on lang toggle */ }
    else { showMainView(); }
  }

  $('langToggle').onclick = ()=>{
    stopSpeech();
    lang = lang==='fr' ? 'en' : 'fr';
    renderAll();
  };
  $('continueCard').onclick = ()=>{ openDetail(todayDayOfYear()); };
  $('viewMonthsBtn').onclick = ()=>{ setViewMode('months'); };
  $('viewYearBtn').onclick = ()=>{ setViewMode('year'); };
  $('searchBtn').onclick = performSearch;
  $('searchInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter') performSearch(); });
  $('favoritesBtn').onclick = ()=>{ openFavorites(); };
  $('reflectionsBtn').onclick = ()=>{ openReflections(); };
  $('settingsBtn').onclick = ()=>{ openSettings(); };
  $('fontDecBtn').onclick = ()=>{
    state.settings.scale = Math.max(0.85, +(state.settings.scale - 0.15).toFixed(2));
    applyScriptureScale();
    saveState();
  };
  $('fontIncBtn').onclick = ()=>{
    state.settings.scale = Math.min(1.6, +(state.settings.scale + 0.15).toFixed(2));
    applyScriptureScale();
    saveState();
  };
  $('themeToggle').onclick = ()=>{
    state.settings.theme = state.settings.theme === 'dark' ? 'light' : 'dark';
    applyTheme();
    saveState();
  };

  // ---------- CHAT ASSISTANT ----------
  let chatHistory = []; // {role:'user'|'assistant', content:string}
  let chatOpened = false;

  function chatAppend(role, text){
    const msgs = $('chatMessages');
    const div = document.createElement('div');
    div.className = 'chat-msg ' + role;
    div.textContent = text;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
    return div;
  }

  function openChat(){
    $('chatPanel').hidden = false;
    $('chatFab').hidden = true;
    if(!chatOpened){
      chatOpened = true;
      chatAppend('assistant', UI[lang].chatWelcome);
    }
    $('chatInput').focus();
  }
  function closeChat(){
    $('chatPanel').hidden = true;
    $('chatFab').hidden = false;
  }

  function currentDayContext(){
    if(!currentDetailDay) return "";
    const readings = getReadingsForDay(currentDetailDay - 1);
    const verse = VERSES[(currentDetailDay - 1) % VERSES.length];
    const psalmStr = readings.psalm.book[lang] + " " + readings.psalm.chapter;
    const provStr = readings.proverb.book[lang] + " " + readings.proverb.chapter;
    return (lang==='fr'
      ? `L'utilisateur est actuellement au jour ${currentDetailDay} du programme. Lecture du jour : ${psalmStr}, ${provStr}. Verset du jour : "${verse.fr}" (${verse.ref.fr}).`
      : `The user is currently on day ${currentDetailDay} of the plan. Today's reading includes: ${psalmStr}, ${provStr}. Verse of the day: "${verse.en}" (${verse.ref.en}).`);
  }

  async function sendChatMessage(){
    const input = $('chatInput');
    const text = input.value.trim();
    if(!text) return;
    input.value = '';
    chatAppend('user', text);
    chatHistory.push({role:'user', content:text});

    const typingEl = chatAppend('assistant typing', UI[lang].chatTyping);

    const systemPrompt = (lang === 'fr'
      ? "Tu es l'assistant du site 365 Grace, un compagnon de lecture biblique quotidienne, chaleureux et bienveillant. Réponds brièvement (3 à 6 phrases), avec douceur, en français. "
      : "You are the assistant for the 365 Grace site, a warm daily Bible-reading companion. Answer briefly (3 to 6 sentences), gently, in English. ")
      + currentDayContext();

    try{
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          system: systemPrompt,
          messages: chatHistory
        })
      });
      const data = await response.json();
      const replyText = (data.content || [])
        .map(block => block.type === 'text' ? block.text : '')
        .filter(Boolean)
        .join('\n') || UI[lang].chatError;
      typingEl.remove();
      chatAppend('assistant', replyText);
      chatHistory.push({role:'assistant', content:replyText});
    }catch(e){
      typingEl.remove();
      chatAppend('assistant', UI[lang].chatError);
    }
  }

  $('chatFab').onclick = openChat;
  $('closeChatBtn').onclick = closeChat;
  $('chatSendBtn').onclick = sendChatMessage;
  $('chatInput').addEventListener('keydown', (e)=>{
    if(e.key === 'Enter') sendChatMessage();
  });

  // ---------- INIT ----------
  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('service-worker.js').catch(()=>{ /* PWA install optional, ignore failures */ });
    });
  }
  (async function init(){
    await loadTranslations();
    await loadState();
    applyTheme();
    applyScriptureScale();
    currentMonth = dayToMonthIndex(todayDayOfYear());
    renderAll();
  })();

})();
</script>
</body>
</html>
